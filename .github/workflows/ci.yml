name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --check
      - run: npm pack --dry-run

  smoke:
    name: Installed CLI smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install the packed tarball globally
        run: |
          npm pack --silent
          npm install --global ./bachbntdev-devcmd-*.tgz
      - name: Run the installed binaries
        run: |
          dev help
          devcmd doctor
          dev inspect --json
      - name: Scaffold a real React project, then build it
        working-directory: ${{ runner.temp }}
        run: |
          dev react smoke-app --typescript --npm --no-git
          test -d smoke-app/node_modules
          cd smoke-app
          dev inspect --json
          dev build
      - name: Scaffold an Express project and skip dependency installation
        working-directory: ${{ runner.temp }}
        run: |
          dev express smoke-express --no-git --no-install
          test ! -d smoke-express/node_modules
          dev install smoke-express
          test -d smoke-express/node_modules
      - name: Scaffold a Python project
        working-directory: ${{ runner.temp }}
        run: |
          dev fastapi smoke-api --no-install --no-git
          dev inspect smoke-api --json

  macos-e2e:
    # The macOS runner is a real macOS virtual machine, so the cleaning features run here for real:
    # plutil, the Trash, xcrun, and sudo (passwordless on the runner). See scripts/macos-e2e.js.
    name: macOS cleaning end to end
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: node scripts/macos-e2e.js
