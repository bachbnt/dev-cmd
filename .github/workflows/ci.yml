name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --check
      - run: npm pack --dry-run

  smoke:
    name: Installed CLI smoke test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install the packed tarball globally
        run: |
          npm pack --silent
          npm install --global ./bachbntdev-devcmd-*.tgz
      - name: Run the installed binaries
        run: |
          dev help
          devcmd doctor
          dev inspect --json
      - name: Scaffold, install, and build a real React project
        working-directory: ${{ runner.temp }}
        run: |
          dev react smoke-app --typescript --npm --no-git
          cd smoke-app
          dev inspect --json
          dev install
          dev build
      - name: Scaffold a Python project
        working-directory: ${{ runner.temp }}
        run: |
          dev fastapi smoke-api --no-install --no-git
          dev inspect smoke-api --json
