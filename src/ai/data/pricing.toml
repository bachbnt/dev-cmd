# SYNC: this file is a copy of aicost's crates/core/data/pricing.toml (copied 2026-11-26). The
# prices live in two repositories for now: when one changes, change both and run
# `node scripts/ai-parity.js`. The matching rules below are identical in both programs.
#
# Prices in USD per 1,000,000 tokens. This file is built into aicost; to change or add a model,
# put the same kind of entry in ~/.config/aicost/pricing.toml (or pass --pricing FILE). An entry
# of yours replaces the built-in one with the same `match`.
#
# `match` is a model name. It matches that name exactly, or that name followed by a date stamp
# (`claude-sonnet-5-5-20261001`), and ignores a `[1m]` suffix. It never matches a longer
# version number, so `claude-sonnet-5` does not catch `claude-sonnet-5-6`.
#
# A request to a model with no entry is still counted: its tokens show in the report, its cost
# does not, and the report says which models are missing.
#
# These are API prices. If you pay a subscription instead, the totals are what the same usage
# would cost on the API, not what you are billed.
#
# Optional fields: `cache_read`, `cache_write_5m`, `cache_write_1h` (each defaults to `input`),
# `source` and `note` (free text, not used in the maths).

# --- Anthropic. Prices: the Claude API docs, as cached 2026-11-03. Cache writes are 1.25x the
# --- input price for the 5 minute cache and 2x for the 1 hour cache; cache reads are 0.1x unless
# --- the docs name another figure.

[[model]]
match = "claude-fable-5-2"
input = 8.00
output = 40.00
cache_read = 0.20
cache_write_5m = 10.00
cache_write_1h = 16.00
source = "Claude API docs"

